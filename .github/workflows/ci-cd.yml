name: Build, Push, and Deploy via Ansible + Helm

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Ansible & Helm)
        uses: actions/checkout@v4

      - name: Clone Microservices Source Code
        run: |
          git clone https://github.com/GoogleCloudPlatform/microservices-demo.git temp-src

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name boutiqueacr4516

      - name: Install Skaffold
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          sudo install skaffold /usr/local/bin/

      - name: Build and Push All Images via Skaffold
        run: |
          cd temp-src
          skaffold build --default-repo=boutiqueacr4516.azurecr.io --file-output=artifacts.json

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: test
          cluster-name: test

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Install Python and Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install ansible

      - name: Install Ansible Collections
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Run Ansible Playbook
        run: |
          ansible-playbook playbooks/deploy.yml
