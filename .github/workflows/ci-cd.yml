name: Build, Push, and Deploy via Ansible + Helm

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name boutiqueacr4516

      - name: Build and Push Microservices to ACR
        run: |
          SERVICES="frontend cartservice productcatalogservice currencyservice paymentservice shippingservice emailservice checkoutservice recommendationservice adservice loadgenerator"
          
          for service in $SERVICES; do
            echo "Building and pushing $service..."
            docker build -t boutiqueacr4516.azurecr.io/$service:latest ./src/$service
            docker push boutiqueacr4516.azurecr.io/$service:latest
          done

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: test
          cluster-name: test

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Install Python and Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install ansible

      - name: Install Ansible Collections
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Run Ansible Playbook
        run: |
          ansible-playbook playbooks/deploy.yml
